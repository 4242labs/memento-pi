name: Question
description: How the lifecycle works, or whether it is meant to work that way.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: The question
    validations: { required: true }
  - type: textarea
    id: context
    attributes:
      label: What you tried, or what you read
      description: A link to the doc that was unclear is a useful answer in itself.
